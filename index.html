<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Closed Permanently | Shon Johnson</title>
  <style>
    :root { color-scheme: dark; --green: #0b261d; --gold: #d7ae55; --cream: #f4f0e6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, #173f30 0%, var(--green) 55%, #071711 100%); color: var(--cream); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(720px, 100%); padding: clamp(36px, 8vw, 76px) 24px; text-align: center; border: 1px solid rgba(215,174,85,.48); background: rgba(4,18,13,.45); }
    .mark { margin: 0 auto 32px; display: grid; place-items: center; width: 72px; height: 72px; border: 2px solid var(--gold); color: var(--gold); font-size: 24px; font-weight: 800; letter-spacing: -2px; }
    .eyebrow { margin: 0 0 14px; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .24em; }
    h1 { margin: 0; font-size: clamp(40px, 9vw, 76px); line-height: .95; letter-spacing: -.045em; }
    .rule { width: 56px; height: 3px; margin: 28px auto; background: var(--gold); }
    .message { margin: 0; color: rgba(244,240,230,.84); font-size: clamp(16px, 2.4vw, 19px); line-height: 1.65; }
    footer { margin-top: 42px; color: rgba(244,240,230,.55); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SJ</div>
    <p class="eyebrow">SHON JOHNSON</p>
    <h1>CLOSED<br>PERMANENTLY</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">Thank you for following along.<br>This website is now closed.</p>
    <footer>Class of 2030 · Ravenscroft School</footer>
  </main>
</body>
</html>
